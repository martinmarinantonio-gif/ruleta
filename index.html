<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta de la Suerte Realista</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .contenedor {
            position: relative;
        }
        canvas {
            border: 8px solid #333;
            border-radius: 50%;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }
        .marcador {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 35px solid #e74c3c;
            z-index: 10;
        }
        button {
            margin-top: 25px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #25d366; /* Verde WhatsApp */
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s ease;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>🎡 Ruleta de 20 Casillas</h1>
    <div class="contenedor">
        <div class="marcador"></div>
        <canvas id="ruleta" width="400" height="400"></canvas>
    </div>
    <button id="btn-girar" onclick="girar()">¡GIRAR RULETA!</button>

    <script>
        const canvas = document.getElementById('ruleta');
        const ctx = canvas.getContext('2d');
        const btnGirar = document.getElementById('btn-girar');
        const casillas = 20;
        const radio = canvas.width / 2;
        
        let anguloActual = 0;
        let velocidad = 0;
        const friccion = 0.988; // Controla la suavidad del frenado (más cerca de 1 = frena más lento)
        let enMovimiento = false;

        // Generar 20 colores HSL bonitos y variados
        const colores = [];
        for (let i = 0; i < casillas; i++) {
            colores.push(`hsl(${(i * 360) / casillas}, 85%, 55%)`);
        }

        function dibujarRuleta() {
            const anguloCasilla = (2 * Math.PI) / casillas;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < casillas; i++) {
                ctx.beginPath();
                ctx.fillStyle = colores[i];
                ctx.moveTo(radio, radio);
                ctx.arc(radio, radio, radio, anguloActual + i * anguloCasilla, anguloActual + (i + 1) * anguloCasilla);
                ctx.lineTo(radio, radio);
                ctx.fill();
                
                // Líneas divisorias estéticas
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Dibujar los números centrados en cada porción
                ctx.save();
                ctx.translate(radio, radio);
                ctx.rotate(anguloActual + i * anguloCasilla + anguloCasilla / 2);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px Arial";
                ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
                ctx.shadowBlur = 4;
                ctx.fillText(i + 1, radio * 0.65, 6);
                ctx.restore();
            }

            // Círculo central estético (Eje de la ruleta)
            ctx.beginPath();
            ctx.arc(radio, radio, 25, 0, 2 * Math.PI);
            ctx.fillStyle = '#333333';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
        }

        function girar() {
            if (enMovimiento) return; // Evita que se pulse mientras gira
            
            enMovimiento = true;
            btnGirar.disabled = true;
            btnGirar.style.backgroundColor = '#ccc';

            // Velocidad inicial aleatoria alta para el impulso de salida
            velocidad = Math.random() * 0.3 + 0.4; 

            function animacion() {
                anguloActual += velocidad;
                velocidad *= friccion; // Aplica el frenado gradual realista

                dibujarRuleta();

                // Si la velocidad es casi cero, se detiene por completo
                if (velocidad < 0.001) {
                    enMovimiento = false;
                    btnGirar.disabled = false;
                    btnGirar.style.backgroundColor = '#25d366';
                    return;
                }

                requestAnimationFrame(animacion);
            }
            
            animacion();
        }

        dibujarRuleta();
    </script>
</body>
</html>
